# compose.yaml
services:
  listener:
    build: .
    command: ./listener
    networks: [wol]
  sender:
    build: .
    volumes: ["./wol.sh:/wol.sh:ro"]
    command: bash /wol.sh AA:BB:CC:DD:EE:FF 172.28.0.255 9
    networks: [wol]
    profiles: [manual]

networks:
  wol:
    ipam:
      config:
        - subnet: 172.28.0.0/24